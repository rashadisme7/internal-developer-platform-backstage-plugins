name: Diag2
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - env:
          U: ${{ secrets.OCI_REGISTRY_USERNAME }}
          P: ${{ secrets.OCI_REGISTRY_PASSWORD }}
        run: |
          echo "ulen=${#U} plen=${#P} ufirst=${U:0:1} pfirst4=${P:0:4} plast4=${P: -4}"
          echo -n "$P" | docker login harbor.rashad.diy -u "$U" --password-stdin
